name: TestUnit
on: [pull_request]

jobs:
  test-unit:
    name: Test Units
    runs-on: ubuntu-latest
    steps:
       - name: Checkout source code
         uses: actions/checkout@v3
       - name: Setup go
         uses: actions/setup-go@v3
         with:
          go-version-file: 'go.mod'
       - run: make test-unit
